name: variable_blur
description: "Progressive (variable) blur for Flutter: fade any widget from sharp to blurred under headers, tab bars, photos, players, maps and video."
version: 0.2.0
homepage: https://github.com/ibrahimbnc/variable_blur
repository: https://github.com/ibrahimbnc/variable_blur

topics:
  - blur
  - ui
  - effects
  - shaders
  - widget

screenshots:
  - description: Story cards whose photos melt into a blur tinted with their own colour.
    path: doc/screenshots/story_cards.jpg
  - description: A feed blurring under a frosted header and tab bar.
    path: doc/screenshots/frosted_feed.jpg
  - description: Music player with album art melting into the controls.
    path: doc/screenshots/music_player.jpg
  - description: Travel cards with blur behind the title and price.
    path: doc/screenshots/travel_cards.jpg
  - description: Lock screen with the wallpaper softening behind notifications.
    path: doc/screenshots/lock_screen.jpg
  - description: Tilt-shift miniature city.
    path: doc/screenshots/miniature_city.jpg
  - description: Map fading into blur behind the search bar and place card.
    path: doc/screenshots/map_explorer.jpg
  - description: Video with a blurred caption area that follows playback.
    path: doc/screenshots/video_story.jpg

environment:
  sdk: ">=3.8.0 <4.0.0"
  flutter: ">=3.32.0"

# Platform restrictions - only support iOS and Android
platforms:
  android:
  ios:

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.

flutter:
  uses-material-design: true
  # To add assets to your package, add an assets section, like this:
  shaders:
    - shaders/variable_blur_pass.frag
    - shaders/variable_blur_composite.frag

  #
  # For details regarding assets in packages, see
  # https://flutter.dev/to/asset-from-package
  #
  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # To add custom fonts to your package, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
